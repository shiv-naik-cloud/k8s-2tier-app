apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: twotier-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/shiv-naik-cloud/k8s-2tier-app.git
    targetRevision: HEAD
    path: manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: twotier-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true